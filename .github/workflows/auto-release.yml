name: Tag an approved manifest refresh

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: manifest-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'automation/manifest-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the bot identity and the owner's approval
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BOT_LOGIN: ${{ vars.RH_MCP_BOT_LOGIN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          actual=$(gh pr view "$PR_NUMBER" --json author --jq .author.login)
          decision=$(gh pr view "$PR_NUMBER" --json reviewDecision --jq .reviewDecision)
          test -n "$EXPECTED_BOT_LOGIN" || { echo "RH_MCP_BOT_LOGIN is unset"; exit 1; }
          test "$actual" = "$EXPECTED_BOT_LOGIN" || {
            echo "refusing non-bot PR author: $actual"
            exit 1
          }
          test "$decision" = "APPROVED" || {
            echo "refusing PR without current approval: $decision"
            exit 1
          }

      - name: Verify the release-shaped diff and patch version
        env:
          HEAD_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          base_sha=$(git rev-parse "$HEAD_SHA^")
          python scripts/verify_release_pr.py "$base_sha" "$HEAD_SHA"

      - name: Mint the separate tag-writing token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RH_MCP_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RH_MCP_RELEASE_APP_PRIVATE_KEY }}

      - name: Create one annotated tag without a replacement path
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v$version"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "refusing to move or replace existing tag $tag"
            exit 1
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git tag -a "$tag" -m "Release $tag after approved manifest refresh"
          git push origin "refs/tags/$tag"
