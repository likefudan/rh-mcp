name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `requires-python = ">=3.12"` is a promise the suite has to keep, so
        # the supported range is tested rather than whichever interpreter the
        # runner happens to ship.
        #
        # Two legs, not four, because only two behavioural classes exist among
        # the versions we support. 3.12.3 is pinned deliberately: two stdlib
        # behaviours this package's security boundary depends on are *patch*-
        # version dependent, and both differ between 3.12.3 and 3.12.13:
        #   - IPv6Address('::ffff:127.0.0.1').is_loopback
        #   - urlsplit('http://[::1]extra:80/mcp').hostname
        # Every later version measured agrees with 3.13, so latest-3.12 would
        # only restate what 3.13 already proves. Testing solely the newest
        # patch of each minor is what let a regression through once already;
        # the second behaviour above fails open.
        #
        # Note this pin is a regression guard, not a general policy: it covers
        # the one old patch known to have bitten us, not the oldest patch of
        # every supported minor.
        python-version: ["3.12.3", "3.13"]
    env:
      # setup-uv's own `python-version` does not constrain `uv sync`/`uv run`,
      # which resolve an interpreter themselves — this is what silently made CI
      # test an arbitrary runner interpreter while the workflow claimed
      # otherwise. UV_PYTHON applies to every uv command in the job.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      # Assert, don't just print. If UV_PYTHON ever stops constraining uv, every
      # matrix leg would silently collapse onto one interpreter and stay green —
      # which is the exact failure this matrix was written in response to.
      - run: |
          uv run python -VV
          uv run python -c "import sys; want='${{ matrix.python-version }}'.split('.'); got=[str(n) for n in sys.version_info[:len(want)]]; assert got == want, f'expected {want}, running {got}'; print(f'interpreter confirmed: {\".\".join(got)}')"
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
