name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `requires-python = ">=3.12"` is a promise the suite has to keep, so
        # the supported range is tested rather than whichever interpreter the
        # runner happens to ship.
        #
        # Two legs, not four, because only two behavioural classes exist among
        # the versions we support. 3.12.3 is pinned deliberately: two stdlib
        # behaviours this package's security boundary depends on are *patch*-
        # version dependent, and both differ between 3.12.3 and 3.12.13:
        #   - IPv6Address('::ffff:127.0.0.1').is_loopback
        #   - urlsplit('http://[::1]extra:80/mcp').hostname
        # Every later version measured agrees with 3.13, so latest-3.12 would
        # only restate what 3.13 already proves. Testing solely the newest
        # patch of each minor is what let a regression through once already;
        # the second behaviour above fails open.
        #
        # Note this pin is a regression guard, not a general policy: it covers
        # the one old patch known to have bitten us, not the oldest patch of
        # every supported minor.
        python-version: ["3.12.3", "3.13"]
    env:
      # setup-uv's own `python-version` does not constrain `uv sync`/`uv run`,
      # which resolve an interpreter themselves — this is what silently made CI
      # test an arbitrary runner interpreter while the workflow claimed
      # otherwise. UV_PYTHON applies to every uv command in the job.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, so the changelog-link assertion in `test_dependency_bounds`
          # runs instead of skipping. It resolves `[Unreleased]`'s comparison
          # base against `git tag`, and the default depth-1 checkout fetches
          # none — the assertion would pass vacuously in the one place it is
          # meant to run, which is how this repository shipped
          # `v0.3.1...HEAD` and `v0.3.2...HEAD` against tags never cut.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      # Assert, don't just print. If UV_PYTHON ever stops constraining uv, every
      # matrix leg would silently collapse onto one interpreter and stay green —
      # which is the exact failure this matrix was written in response to.
      - run: |
          uv run python -VV
          uv run python -c "import sys; want='${{ matrix.python-version }}'.split('.'); got=[str(n) for n in sys.version_info[:len(want)]]; assert got == want, f'expected {want}, running {got}'; print(f'interpreter confirmed: {\".\".join(got)}')"
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

      # The independent reviewer's own adversarial tests, run as an acceptance
      # gate rather than as a historical document. Four of these failed against
      # v0.1.0 and those four failures were findings P0 and P1; running them on
      # every commit is what stops either finding returning quietly. They are
      # deliberately outside `testpaths`, so `uv run pytest` above does not
      # reach them — this line is not redundant.
      - name: Independent security review — adversarial tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        # Every reviewer's suite, discovered from the directory rather than
        # listed. Naming files here is the same mistake as `TestNoEscapeHatch`
        # asserting against one class: the next review's tests would be added
        # to the repo and silently not run. They live outside `testpaths` on
        # purpose, so the `uv run pytest` above does not reach them, and this
        # step is not redundant with it.
        run: |
          suites=$(find security-review -name 'test_*.py' | sort)
          test -n "$suites" || { echo "no reviewer suites found"; exit 1; }
          echo "running: $suites"
          # Three stale exact-manifest assertions are deselected by full node id, with
          # their exact reasons recorded in DESIGN §12.4.
          # `test_exact_8_trading_denied_and_11_mutations_allowed` opens by
          # pinning the manifest version and digest, so after any refresh it
          # fails on its first line and never reaches the assertions its name
          # is about. Their file is not edited for this — editing an auditor's
          # evidence to make it pass is only defensible when the file
          # contradicts itself, and this does not. The property it guards is
          # held by `TestTheShippedManifest`, which asserts the same 8
          # trading denials, 11 flagged mutations and current 47/12 split against
          # whatever manifest ships. If that deselection ever hides more than
          # it should, the fix is a re-review, not a wider `-k`.
          #
          # It hides historical assertions as the surface evolves, and the swap is worth
          # naming. Manifest 2026.08.09 added `get_limited_margin_upgrade_info`
          # as an allowed read, so their `denied == set(DENIED_TRADING)` still
          # held at that point — the denied set was exactly the 8 trading tools —
          # but their `len(allowed_read) == 34` would now fail on a 35th read.
          # That is a permission *expansion* hidden behind this line, which is
          # a weaker position than the extra-denial case it replaced. It is
          # held instead by `TestTheShippedManifest`, which pins 35 reads, the
          # 46/8 split, and the denied set as a set. DESIGN §12.4 put that tool
          # appearance behind a new independent review; PR #34 completed it
          # before merge. This deselection still discharges nothing by itself:
          # the current manifest boundary must remain held by the shipped-
          # manifest tests and by the review of the exact release candidate.
          # The v0.3.3 review then pinned the complete 54-entry / 35-read
          # surface. Manifest 2026.08.28 adds the independently reviewed
          # `get_equity_news` read, and manifest 2026.08.30 records four new SEC
          # reads as explicitly denied. Only the suite's exact split assertion
          # is stale; all of its mutation and export-boundary tests still run.
          # `TestTheShippedManifest` now pins 59 entries, 36 allowed reads,
          # 11 non-trading mutations, the 47/12 split, and the exact denied set.
          deselected=(
            'security-review/v0.1.0/test_adversarial_review.py::TestPackagedManifestBoundary::test_exact_8_trading_denied_and_11_mutations_allowed'
            'security-review/0.3.3/test_adversarial_review_v033.py::TestTheDeniedSetIsStillExactlyTheTradingSurface::test_denied_is_that_set_and_nothing_else'
            'security-review/0.3.3/test_adversarial_review_v033.py::TestTheDeniedSetIsStillExactlyTheTradingSurface::test_the_split_is_35_reads_11_mutations_8_denied'
          )
          deselect_args=()
          for node_id in "${deselected[@]}"; do
            deselect_args+=(--deselect "$node_id")
          done
          uv run pytest $suites -v "${deselect_args[@]}"

  # Everything above tests the source tree. This tests the artifact a consumer
  # actually installs, which is not the same thing: package data can be missing
  # from a wheel while every source-tree test passes, and the manifest *is*
  # package data. A gateway whose manifest did not install cannot become ready.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv build

      # The sdist must be a function of the commit, not of whoever's working
      # tree it was built in. The released v0.1.0 sdist was not: it carried
      # `.claude/settings.local.json`, absent from the tagged commit, and the
      # published checksum matched that dirty artifact — so the thing consumers
      # could verify against was itself the wrong thing. An allowlist, so that
      # the next unexpected path fails here whether or not anyone predicted it.
      - name: The sdist contains only allowlisted paths
        run: uv run python scripts/check_sdist.py dist/*.tar.gz

      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/smoke
          # No --frozen, no source tree on the path: this must work from the
          # artifact alone, the way a consumer gets it.
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl

      - name: The manifest, LICENSE and NOTICE ship in the wheel
        run: |
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          import importlib.metadata as md, json
          from rh_mcp.manifest import PACKAGED_MANIFEST_PATH, load_active_manifest

          assert PACKAGED_MANIFEST_PATH.is_file(), "manifest missing from the installed package"
          manifest = load_active_manifest()
          assert manifest.digest == manifest.declared_digest
          print(f"manifest {manifest.manifest_version}: {manifest.digest}")

          files = {f.name for f in md.files("rh-mcp") or []}
          for required in ("LICENSE", "NOTICE"):
              assert required in files, f"{required} missing from the distribution"
          print("LICENSE and NOTICE present")
          PY

      - name: The console script exists and refuses without configuration
        run: |
          cd /tmp
          /tmp/smoke/bin/rh-mcp --help > /dev/null
          # No expected digest configured: must be a configuration error (exit 3),
          # never a crash and never a success.
          set +e
          /tmp/smoke/bin/rh-mcp capabilities > /tmp/out.txt 2> /tmp/err.txt
          code=$?
          set -e
          test "$code" -eq 3 || { echo "expected exit 3, got $code"; cat /tmp/err.txt; exit 1; }
          test ! -s /tmp/out.txt || { echo "stdout must be empty on failure"; exit 1; }
          echo "unconfigured invocation: exit 3, stdout empty"

      - name: Trading capabilities are denied in the shipped manifest
        run: |
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          from rh_mcp.manifest import load_active_manifest

          TRADING = (
              "place_equity_order", "place_option_order", "exercise_option",
              "cancel_equity_order", "cancel_option_order", "cancel_option_exercise",
              "review_equity_order", "review_option_order",
          )
          manifest = load_active_manifest()
          for name in TRADING:
              entry = manifest.capabilities[name]
              assert entry.disposition == "denied", f"{name} is {entry.disposition} in the wheel"
          print(f"{len(TRADING)} trading capabilities denied in the installed artifact")
          PY

      - name: Checksums
        run: |
          cd dist && sha256sum * | tee SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
