[project]
name = "rh-mcp"
# 0.3.0 gives the permission-expanded manifest lineage introduced on
# 2026.08.09 a package identity distinct from the already released v0.2.0
# artifact. 0.3.1 adds release automation without changing the manifest or
# any runtime compatibility surface.
# SemVer for a 0.x package makes the minor the breaking position. See
# CHANGELOG.md.
version = "0.3.1"
description = "A default-deny Python Read Gateway for Robinhood's official MCP server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# DESIGN.md §12: pinned compatible MCP SDK v2 constraints. Both are *private*
# implementation dependencies (§4) — no public signature, exception, serialized
# result, or type annotation may contain an `mcp.*` or `httpx2.*` type, and
# `tests/test_dependency_boundary.py` enforces that mechanically.
#
# The upper bounds are the point. A consumer that holds its own MCP SDK must
# not have a major-version bump forced on it by installing this package, and a
# v3 SDK could change the wire contract this gateway's fail-closed checks are
# written against. Widening either bound is a security-boundary change: it
# needs the §12 release-gate review, not a dependency-update PR.
#
# `httpx2` (not `httpx`) is what MCP SDK v2 depends on and what the guarded
# transport in `transport.py` subclasses.
dependencies = [
    "httpx2>=2.5.0,<3.0.0",
    "mcp>=2.0.0,<3.0.0",
]

[project.scripts]
rh-mcp = "rh_mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rh_mcp"]

# An allowlist, and it has to be one. Hatchling's default sdist is "everything
# in the directory that git does not ignore", which is a blocklist whose
# entries live in `.gitignore` — so any file a contributor's tooling drops into
# the tree and nobody thought to ignore ships to PyPI. That is not theoretical:
# the released `rh_mcp-0.1.0.tar.gz` contains `.claude/settings.local.json`,
# a developer's local editor permissions including a filesystem path, which is
# in no commit at the tagged revision. The wheel was clean and byte-identical
# to a rebuild; the sdist was not, which means the release was cut from a dirty
# working tree.
#
# No credential was in that file. The reason to fix it anyway is
# reproducibility: an sdist that is not a function of the commit cannot be
# verified against the commit, and "rebuild it yourself and compare" is the
# only check a consumer can run without trusting us. §11.
#
# Adding a pattern here is a supply-chain change. `scripts/check_sdist.py`
# re-derives the same allowlist independently and CI runs it against the built
# artifact, so a widened glob has to be widened in two places by someone who
# meant it.
[tool.hatch.build.targets.sdist]
include = [
  "/src/rh_mcp",
  "/tests",
  "/scripts",
  "/security-review",
  "/.github/workflows",
  "/.github/manifest-observation-cert.pem",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/DESIGN.md",
  "/INDEPENDENT_SECURITY_REVIEW.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# `security-review/` holds an outside reviewer's deliverables, kept as they
# wrote them so the repository records what was actually submitted. Two of
# their imports are unused and their import block is unsorted; reformatting
# someone else's evidence to satisfy our linter would make the artifact ours.
# The file is still executed as an acceptance gate — see CI and CHANGELOG.
exclude = ["security-review"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `scripts/mutate.py` holds verbatim copies of source lines it substitutes.
# Wrapping them to fit the line limit would stop them matching the source, and
# a mutation whose target silently no longer matches is a mutation that always
# "passes". The script itself checks that every target is found exactly once.
"scripts/mutate.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rh_mcp"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
